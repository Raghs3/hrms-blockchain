<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="'Times New Roman', Georgia, serif"><defs><marker id="m1F4E79" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F4E79"/></marker><marker id="mE67E22" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E67E22"/></marker><marker id="mC0392B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="m7F8C8D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7F8C8D"/></marker><marker id="m17A589" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17A589"/></marker><marker id="m2E75B6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E75B6"/></marker></defs><rect width="1100" height="800" fill="#FFFFFF"/><rect x="150" y="20" width="800" height="64" rx="32" fill="#1F4E79"/><text x="550.0" y="60.0" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">Smart-Contract Structure</text><rect x="40" y="130" width="470" height="400" rx="12" fill="#fff" stroke="#17A589" stroke-width="3"/><rect x="40" y="130" width="470" height="56" rx="12" fill="#17A589"/><text x="275" y="166" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">UserRegistry  «AccessControl»</text><text x="60" y="216" font-size="17" fill="#17A589" font-weight="bold" text-anchor="start" font-style="normal">Roles (bytes32 constants)</text><text x="60" y="242.0" font-size="17" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">PATIENT_ROLE</text><text x="60" y="265.8" font-size="17" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">DOCTOR_ROLE</text><text x="60" y="289.6" font-size="17" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">HOSPITAL_ADMIN_ROLE</text><line x1="40" y1="330" x2="510" y2="330" stroke="#17A589" stroke-width="2"/><text x="60" y="358" font-size="17" fill="#17A589" font-weight="bold" text-anchor="start" font-style="normal">Functions</text><text x="60" y="384.0" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">registerAsPatient()          — anyone</text><text x="60" y="407.2" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">registerDoctor(addr)         — admin only</text><text x="60" y="430.4" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">registerHospitalAdmin(addr)  — default admin</text><text x="60" y="453.6" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">isPatient / isDoctor / isHospitalAdmin</text><text x="60" y="515" font-size="15" fill="#7F8C8D" font-weight="normal" text-anchor="start" font-style="italic">Events: PatientRegistered · DoctorRegistered</text><rect x="590" y="130" width="470" height="625" rx="12" fill="#fff" stroke="#17A589" stroke-width="3"/><rect x="590" y="130" width="470" height="56" rx="12" fill="#17A589"/><text x="825" y="166" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">RecordRegistry</text><text x="610" y="216" font-size="17" fill="#17A589" font-weight="bold" text-anchor="start" font-style="normal">struct Record</text><text x="610" y="242.0" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">address owner</text><text x="610" y="264.4" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">string cid          // IPFS CID</text><text x="610" y="286.8" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">bytes32 fileHash    // SHA-256</text><text x="610" y="309.2" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">uint256 timestamp</text><text x="610" y="331.6" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">bool exists</text><line x1="590" y1="350" x2="1060" y2="350" stroke="#17A589" stroke-width="2"/><text x="610" y="378" font-size="17" fill="#17A589" font-weight="bold" text-anchor="start" font-style="normal">State</text><text x="610" y="404.0" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">mapping(id ⇒ Record) records</text><text x="610" y="425.0" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">mapping(id ⇒ mapping(addr ⇒ bool))</text><text x="610" y="446.0" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">     authorizedAccess</text><text x="610" y="467.0" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">mapping(addr ⇒ uint[]) recordsByOwner</text><line x1="590" y1="480" x2="1060" y2="480" stroke="#17A589" stroke-width="2"/><text x="610" y="508" font-size="17" fill="#17A589" font-weight="bold" text-anchor="start" font-style="normal">Functions</text><text x="610" y="534.0" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">addRecord(cid, hash)        — patient</text><text x="610" y="555.75" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">grantAccess(id, doctor)    — owner</text><text x="610" y="577.5" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">revokeAccess(id, doctor)   — owner</text><text x="610" y="599.25" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">checkAccess(addr, id)      — view</text><text x="610" y="621.0" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">getRecord(id)                    — owner/granted</text><text x="610" y="642.75" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">getRecordsByOwner(addr)  — view</text><line x1="590" y1="664" x2="1060" y2="664" stroke="#17A589" stroke-width="2"/><text x="610" y="692" font-size="17" fill="#17A589" font-weight="bold" text-anchor="start" font-style="normal">Events (audit trail)</text><text x="610" y="716.0" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-style="normal">RecordAdded · AccessGranted · AccessRevoked</text><path d="M 590 300 L 510 300" fill="none" stroke="#1F4E79" stroke-width="3" marker-end="url(#m1F4E79)"/><text x="550" y="286" font-size="15" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">isPatient()</text><text x="550" y="322" font-size="15" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">isDoctor()</text><rect x="40" y="560" width="470" height="170" rx="10" fill="#D6E4F0" stroke="#2E75B6" stroke-width="2"/><text x="275" y="592" font-size="17" fill="#1F4E79" font-weight="bold" text-anchor="middle" font-style="normal">Custom errors (gas-cheap reverts)</text><text x="275" y="620.0" font-size="16" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">NotAPatient(account)</text><text x="275" y="642.4" font-size="16" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">NotADoctor(account)</text><text x="275" y="664.8" font-size="16" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">RecordDoesNotExist(id)</text><text x="275" y="687.2" font-size="16" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">NotRecordOwner(id, caller)</text><text x="550" y="776" font-size="20" fill="#444" font-weight="normal" text-anchor="middle" font-style="italic">Fig. 4 — Smart-Contract Structure and Dependencies</text></svg>