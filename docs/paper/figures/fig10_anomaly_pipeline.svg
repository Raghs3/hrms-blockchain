<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="'Times New Roman', Georgia, serif"><defs><marker id="m1F4E79" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F4E79"/></marker><marker id="mE67E22" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E67E22"/></marker><marker id="mC0392B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="m7F8C8D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7F8C8D"/></marker><marker id="m17A589" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17A589"/></marker><marker id="m2E75B6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E75B6"/></marker></defs><rect width="1100" height="760" fill="#FFFFFF"/><rect x="150" y="20" width="800" height="64" rx="32" fill="#1F4E79"/><text x="550.0" y="60.0" font-size="24" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">Rule-Based Anomaly Detection over On-chain Receipts</text><rect x="60" y="130" width="980" height="110" rx="12" fill="#D5F5E3" stroke="#17A589" stroke-width="3"/><text x="550" y="166" font-size="21" fill="#0E6655" font-weight="bold" text-anchor="middle" font-style="normal">On-chain log: AccessReceipt(recordId, owner, accessor, timestamp)</text><text x="550" y="202" font-size="17" fill="#333" font-weight="normal" text-anchor="middle" font-style="normal">Written before any release; tamper-proof. Reads by the record owner are ignored.</text><path d="M 550 240 L 550 290" fill="none" stroke="#17A589" stroke-width="3" marker-end="url(#m17A589)"/><text x="566" y="272" font-size="15" fill="#7F8C8D" font-weight="normal" text-anchor="start" font-style="italic">chain.js · event query</text><rect x="60" y="290" width="980" height="250" rx="12" fill="#D6E4F0" stroke="#2E75B6" stroke-width="3"/><text x="550" y="326" font-size="21" fill="#1F4E79" font-weight="bold" text-anchor="middle" font-style="normal">anomaly.js — three transparent rules per accessor (thresholds env-configurable)</text><rect x="80" y="350" width="300" height="170" rx="8" fill="#2E75B6"/><text x="230" y="384" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">OFF_HOURS</text><text x="230" y="414.0" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">Record opened outside</text><text x="230" y="436.95" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">working hours</text><text x="230" y="459.9" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">(default 07:00–21:00,</text><text x="230" y="482.85" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">IST)</text><rect x="398" y="350" width="300" height="170" rx="8" fill="#2E75B6"/><text x="548" y="384" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">BURST</text><text x="548" y="414.0" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">≥ 5 different records</text><text x="548" y="436.95" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">opened within</text><text x="548" y="459.9" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">10 minutes</text><rect x="716" y="350" width="300" height="170" rx="8" fill="#2E75B6"/><text x="866" y="384" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">WIDE_REACH</text><text x="866" y="414.0" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">Records of ≥ 3 different</text><text x="866" y="436.95" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">patients opened within</text><text x="866" y="459.9" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">60 minutes</text><path d="M 550 540 L 550 590" fill="none" stroke="#2E75B6" stroke-width="3" marker-end="url(#m2E75B6)"/><text x="566" y="572" font-size="15" fill="#7F8C8D" font-weight="normal" text-anchor="start" font-style="italic">GET /admin/anomalies</text><rect x="60" y="590" width="980" height="110" rx="12" fill="#FEF5E7" stroke="#E67E22" stroke-width="3"/><text x="550" y="626" font-size="21" fill="#A04000" font-weight="bold" text-anchor="middle" font-style="normal">Admin portal — alerts with severity and evidence</text><text x="550" y="662" font-size="17" fill="#333" font-weight="normal" text-anchor="middle" font-style="normal">Overview (compact) and Activity History (full): who opened what, when, and why it was flagged.</text><text x="550" y="735" font-size="20" fill="#444" font-weight="normal" text-anchor="middle" font-style="italic">Fig. 10 — Anomaly Detection Pipeline over Access Receipts</text></svg>