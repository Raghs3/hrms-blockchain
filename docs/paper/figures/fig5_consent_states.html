<!doctype html><meta charset="utf-8"><body style="margin:0"><svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" font-family="'Times New Roman', Georgia, serif"><defs><marker id="m1F4E79" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F4E79"/></marker><marker id="mE67E22" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E67E22"/></marker><marker id="mC0392B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="m7F8C8D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7F8C8D"/></marker><marker id="m17A589" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17A589"/></marker><marker id="m2E75B6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E75B6"/></marker></defs><rect width="1100" height="710" fill="#FFFFFF"/><rect x="150" y="20" width="800" height="64" rx="32" fill="#1F4E79"/><text x="550.0" y="60.0" font-size="24" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">Consent State Machine for One (record, doctor) Pair</text><rect x="60" y="150" width="240" height="110" rx="55" fill="#D6E4F0" stroke="#2E75B6" stroke-width="3"/><text x="180.0" y="200" font-size="22" fill="#2E75B6" font-weight="bold" text-anchor="middle" font-style="normal">No Access</text><text x="180.0" y="230" font-size="17" fill="#333" font-weight="normal" text-anchor="middle" font-style="normal">checkAccess = false</text><rect x="430" y="150" width="240" height="110" rx="55" fill="#D5F5E3" stroke="#17A589" stroke-width="3"/><text x="550.0" y="200" font-size="22" fill="#17A589" font-weight="bold" text-anchor="middle" font-style="normal">Granted</text><text x="550.0" y="230" font-size="17" fill="#333" font-weight="normal" text-anchor="middle" font-style="normal">checkAccess = true</text><rect x="800" y="150" width="240" height="110" rx="55" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><text x="920.0" y="200" font-size="22" fill="#C0392B" font-weight="bold" text-anchor="middle" font-style="normal">Revoked</text><text x="920.0" y="230" font-size="17" fill="#333" font-weight="normal" text-anchor="middle" font-style="normal">checkAccess = false</text><rect x="430" y="380" width="240" height="110" rx="55" fill="#FEF5E7" stroke="#E67E22" stroke-width="3"/><text x="550.0" y="430" font-size="22" fill="#E67E22" font-weight="bold" text-anchor="middle" font-style="normal">Expired</text><text x="550.0" y="460" font-size="17" fill="#333" font-weight="normal" text-anchor="middle" font-style="normal">checkAccess = false</text><path d="M 300 185 L 430 185" fill="none" stroke="#17A589" stroke-width="3" marker-end="url(#m17A589)"/><text x="365" y="168" font-size="15" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">grantAccess()</text><text x="365" y="212" font-size="13" fill="#7F8C8D" font-weight="normal" text-anchor="middle" font-style="italic">expiry + purpose</text><path d="M 670 185 L 800 185" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#mC0392B)"/><text x="735" y="168" font-size="15" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">revokeAccess()</text><text x="735" y="212" font-size="13" fill="#7F8C8D" font-weight="normal" text-anchor="middle" font-style="italic">emit AccessRevoked</text><path d="M 800 235 L 670 235" fill="none" stroke="#17A589" stroke-width="3" marker-end="url(#m17A589)"/><text x="735" y="258" font-size="14" fill="#222" font-weight="normal" text-anchor="middle" font-style="normal">re-grant</text><path d="M 500 260 L 500 380" fill="none" stroke="#E67E22" stroke-width="3" marker-end="url(#mE67E22)"/><text x="488" y="322" font-size="14" fill="#A04000" font-weight="normal" text-anchor="end" font-style="normal">expiry reached</text><text x="488" y="342" font-size="13" fill="#7F8C8D" font-weight="normal" text-anchor="end" font-style="italic">(no transaction)</text><path d="M 600 380 L 600 260" fill="none" stroke="#17A589" stroke-width="3" marker-end="url(#m17A589)"/><text x="612" y="322" font-size="14" fill="#222" font-weight="normal" text-anchor="start" font-style="normal">re-grant (extend)</text><circle cx="40" cy="205" r="9" fill="#1F4E79"/><path d="M 49 205 L 60 205" fill="none" stroke="#1F4E79" stroke-width="3" marker-end="url(#m1F4E79)"/><text x="550" y="540" font-size="17" fill="#1F4E79" font-weight="normal" text-anchor="middle" font-style="italic">Revocation and expiry are immediate: no grace period, no cached permission — the next getRecord() by the doctor reverts.</text><rect x="60" y="570" width="980" height="90" rx="12" fill="#FEF5E7" stroke="#E67E22" stroke-width="2"/><text x="550" y="602.0" font-size="18" fill="#A04000" font-weight="normal" text-anchor="middle" font-style="normal">Record owner (patient) always passes checkAccess — no grant needed.</text><text x="550" y="629.0" font-size="18" fill="#A04000" font-weight="normal" text-anchor="middle" font-style="normal">Every grant, revoke and read (AccessReceipt) is an immutable on-chain event.</text><text x="550" y="690" font-size="20" fill="#444" font-weight="normal" text-anchor="middle" font-style="italic">Fig. 5 — Consent State Machine</text></svg></body>
