0392B" font-weight="normal" text-anchor="middle" font-style="normal">403 ACCESS_DENIED (no receipt)</text><rect x="10" y="962" width="1100" height="286" rx="6" fill="#FDEDEC55"/><text x="24" y="980" font-size="15" fill="#555" font-weight="bold" text-anchor="start" font-style="normal">D  Revocation (or expiry) &amp; denial</text><text x="560" y="1308" font-size="20" fill="#444" font-weight="normal" text-anchor="middle" font-style="italic">Fig. 3 — Sequence Diagram: Upload → Grant → Receipted View → Revoke → Deny</text></svg>