ext><text x="730.6666666666666" y="1347.95" font-size="17" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">== on-chain hash</text><path d="M 750 1088 L 900 1088 L 900 1130" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#mC0392B)"/><text x="770" y="1074" font-size="18" fill="#7F8C8D" font-weight="normal" text-anchor="start" font-style="italic">No</text><rect x="780" y="1130" width="240" height="80" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="900" y="1160.0" font-size="17" fill="#C0392B" font-weight="bold" text-anchor="middle" font-style="normal">403 ACCESS_DENIED</text><text x="900" y="1182.95" font-size="17" fill="#C0392B" font-weight="bold" text-anchor="middle" font-style="normal">(revert on-chain)</text><path d="M 200 1311 L 70 1311 L 70 916 L 240 916" fill="none" stroke="#E67E22" stroke-width="3" marker-end="url(#mE67E22)"/><text x="40" y="1100" font-size="17" fill="#E67E22" font-weight="normal" text-anchor="middle" font-style="normal" transform="rotate(-90 40 1100)">Patient revokes (AccessRevoked) → next request denied</text><path d="M 520 1406 L 520 1454" fill="none" stroke="#1F4E79" stroke-width="3" marker-end="url(#m1F4E79)"/><rect x="220" y="1454" width="600" height="100" rx="50" fill="#1F4E79"/><text x="520.0" y="1498.0" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" font-style="normal">Record delivered to authorized doctor</text><text x="520.0" y="1528.0" font-size="20" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">Audit trail: RecordAdded · AccessGranted · AccessRevoked</text><rect x="40" y="1630" width="960" height="200" rx="14" fill="#F0F3F7" stroke="#A9BCD0" stroke-width="2"/><text x="520" y="1672" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle" font-style="normal">Legend</text><circle cx="96" cy="1720" r="16" fill="#1F4E79"/><text x="126" y="1727" font-size="18" fill="#333" font-weight="normal" text-anchor="start" font
